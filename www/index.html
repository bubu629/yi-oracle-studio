    function linesToGuaNum(threeLines) {
      for (const [k, v] of Object.entries(BAGUA)) {
        if (v.lines[0] === threeLines[0] && v.lines[1] === threeLines[1] && v.lines[2] === threeLines[2]) return Number(k);
      }
      return 1;
    }

    function renderGuaCard(title, sixLines, movingIndices, extraHtml) {
      let rows = "";
      for (let i = 5; i >= 0; i--) {
        const isYang = sixLines[i] === 1;
        const isMoving = movingIndices.includes(i);
        rows += '<div class="yao-row ' + (isMoving ? 'yao-moving' : '') + '">' +
          (isYang ? '<div class="yao-yang"></div>' : '<div class="yao-yin"><span></span><span></span></div>') +
          '</div>';
      }
      return '<div class="gua-box"><div class="gua-title">' + title + '</div><div class="gua-lines">' + rows + '</div><div class="gua-meta">' + extraHtml + '</div></div>';
    }

    function tossOneYao() {
      if (yjThrows.length >= 6) yjThrows = [];
      const c = () => (Math.random() < 0.5 ? 2 : 3);
      yjThrows.push(c() + c() + c());
      document.getElementById("tossCount").innerText = yjThrows.length;
      if (yjThrows.length === 6) renderYijingResult();
    }

    function castAllYijing() {
      yjThrows = [];
      for (let i = 0; i < 6; i++) {
        const c = () => (Math.random() < 0.5 ? 2 : 3);
        yjThrows.push(c() + c() + c());
      }
      document.getElementById("tossCount").innerText = "6";
      renderYijingResult();
    }

    function resetYijing() {
      yjThrows = [];
      document.getElementById("tossCount").innerText = "0";
      document.getElementById("yjResult").style.display = "none";
      document.getElementById("yjAiOut").style.display = "none";
    }

    function renderYijingResult() {
      const baseLines = yjThrows.map(v => (v === 7 || v === 9) ? 1 : 0);
      const movingIdx = [];
      const changedLines = yjThrows.map((v, i) => {
        if (v === 9) { movingIdx.push(i); return 0; }
        if (v === 6) { movingIdx.push(i); return 1; }
        return baseLines[i];
      });

      const low1 = linesToGuaNum(baseLines.slice(0, 3));
      const up1  = linesToGuaNum(baseLines.slice(3, 6));
      const hex1 = HEXAGRAMS[up1 + "-" + low1];

      const low2 = linesToGuaNum(changedLines.slice(0, 3));
      const up2  = linesToGuaNum(changedLines.slice(3, 6));
      const hex2 = HEXAGRAMS[up2 + "-" + low2];

      let html = renderGuaCard(
        "本卦：" + hex1[0], baseLines, movingIdx,
        '<span class="tag">' + hex1[3] + '</span><br/>上' + BAGUA[up1].name + '(' + BAGUA[up1].wx + ') 下' + BAGUA[low1].name + '(' + BAGUA[low1].wx + ')'
      );
      if (movingIdx.length > 0) {
        html += renderGuaCard(
          "变卦：" + hex2[0], changedLines, [],
          '<span class="tag">' + hex2[3] + '</span><br/>动爻：第 ' + movingIdx.map(i => i + 1).join("、") + ' 爻'
        );
      }

      document.getElementById("yjGuaGrid").innerHTML = html;
      document.getElementById("yjClassicText").innerHTML =
        "<b>【本卦卦辞】" + hex1[0] + "：</b>" + hex1[1] + "<br/><b>【大象传】</b>" + hex1[2] +
        (movingIdx.length ? "<br/><br/><b>【变卦卦辞】" + hex2[0] + "：</b>" + hex2[1] + "<br/><b>【变卦象曰】</b>" + hex2[2] : "<br/><br/><b>【静卦无动爻】</b>以本卦卦辞与象传为主断。");

      document.getElementById("yjAiOut").style.display = "none";

      lastContext.yijing =

        "本卦：" + hex1[0] + "（" + hex1[1] + " / " + hex1[2] + "）\n" +
        "动爻：" + (movingIdx.length ? movingIdx.map(i => "第" + (i + 1) + "爻").join("、") : "无动爻") + "\n" +

    function judgeTiYong(tiWx, yongWx) {
      if (tiWx === yongWx) return ["体用比和 · 吉", "同类相助，合作顺利，谋事易成。"];
      if (WX_SHENG[yongWx] === tiWx) return ["用生体 · 大吉", "外势生助自身，得贵人相帮，进益之象。"];
      if (WX_KE[tiWx] === yongWx) return ["体克用 · 中吉", "自身掌控局势，虽需费力但终能成事。"];
      if (WX_SHENG[tiWx] === yongWx) return ["体生用 · 小凶（泄耗）", "付出多而回报慢，防精力或财物损耗。"];
      return ["用克体 · 凶", "外部阻力或压力克制自身，宜守不宜攻。"];
    }

    function castMeihua() {
      const mode = document.getElementById("mhMode").value;
      let up, low, dong, timeMeta = "报数起卦";
      if (mode === "time") {
        const now = new Date();
        if (typeof Solar !== "undefined") {
          const lunar = Solar.fromDate(now).getLunar();
          const yZhiIdx = ZHI_LIST.indexOf(lunar.getYearZhiExact()) + 1;
          const lMonth  = Math.abs(lunar.getMonth());
          const lDay    = lunar.getDay();
          const hZhiIdx = ZHI_LIST.indexOf(lunar.getTimeZhi()) + 1;
          up   = (yZhiIdx + lMonth + lDay) % 8 || 8;
          low  = (yZhiIdx + lMonth + lDay + hZhiIdx) % 8 || 8;
          dong = (yZhiIdx + lMonth + lDay + hZhiIdx) % 6 || 6;
          timeMeta = "真农历：" + lunar.getYearInGanZhiExact() + "年 " + lunar.getMonthInChinese() + "月" + lunar.getDayInChinese() + " " + lunar.getTimeZhi() + "时（年支" + yZhiIdx + "+月" + lMonth + "+日" + lDay + "+时支" + hZhiIdx + "）";
        } else {
          const yIdx = ((now.getFullYear() - 4) % 12) + 1;
          const m = now.getMonth() + 1, d = now.getDate();
          const hIdx = Math.floor(((now.getHours() + 1) % 24) / 2) + 1;
          up = (yIdx + m + d) % 8 || 8;
          low = (yIdx + m + d + hIdx) % 8 || 8;
          dong = (yIdx + m + d + hIdx) % 6 || 6;
        }
      } else {
        const n1 = Math.max(1, parseInt(document.getElementById("mhNum1").value || "1", 10));
        const n2 = Math.max(1, parseInt(document.getElementById("mhNum2").value || "1", 10));
        up = n1 % 8 || 8;
        low = n2 % 8 || 8;
        dong = (n1 + n2) % 6 || 6;
        timeMeta = "报数：" + n1 + " / " + n2;
      }

      const baseLines = [...BAGUA[low].lines, ...BAGUA[up].lines];
      const huLow = linesToGuaNum([baseLines[1], baseLines[2], baseLines[3]]);
      const huUp  = linesToGuaNum([baseLines[2], baseLines[3], baseLines[4]]);
      const huLines = [...BAGUA[huLow].lines, ...BAGUA[huUp].lines];

      const bianLines = [...baseLines];
      bianLines[dong - 1] = bianLines[dong - 1] === 1 ? 0 : 1;
      const bianLow = linesToGuaNum(bianLines.slice(0, 3));
      const bianUp  = linesToGuaNum(bianLines.slice(3, 6));

      const hexBen  = HEXAGRAMS[up + "-" + low];
      const hexHu   = HEXAGRAMS[huUp + "-" + huLow];
      const hexBian = HEXAGRAMS[bianUp + "-" + bianLow];

      const tiGua   = dong <= 3 ? BAGUA[up] : BAGUA[low];
      const yongGua = dong <= 3 ? BAGUA[low] : BAGUA[up];
      const bianYongGua = dong <= 3 ? BAGUA[bianLow] : BAGUA[bianUp];

      const [benVerdict, benDesc] = judgeTiYong(tiGua.wx, yongGua.wx);
      const [bianVerdict, bianDesc] = judgeTiYong(tiGua.wx, bianYongGua.wx);

      document.getElementById("mhGuaGrid").innerHTML =
        renderGuaCard("本卦：" + hexBen[0], baseLines, [dong - 1], "动爻：第 " + dong + " 爻") +
        renderGuaCard("互卦：" + hexHu[0], huLines, [], "过程与内因") +
        renderGuaCard("变卦：" + hexBian[0], bianLines, [], "结局与归宿");

      document.getElementById("mhTiYong").innerHTML =
        "<div style='color:#94a3b8;font-size:12px;margin-bottom:6px;'>" + timeMeta + "</div>" +
        "<b>体卦（自身）：</b>" + tiGua.name + "（属" + tiGua.wx + "） &nbsp;|&nbsp; <b>用卦（所问）：</b>" + yongGua.name + "（属" + yongGua.wx + "）<br/>" +
        "<b>当前态势：</b><span class='tag'>" + benVerdict + "</span> — " + benDesc + "<br/>" +
        "<b>最终结局（变用" + bianYongGua.name + "属" + bianYongGua.wx + "）：</b><span class='tag'>" + bianVerdict + "</span> — " + bianDesc;

      document.getElementById("mhResult").style.display = "block";
      document.getElementById("mhAiOut").style.display = "none";

      lastContext.meihua =
        "占问事项：" + (document.getElementById("mhQuestion").value || "当下局势推演") + "\n" +
        timeMeta + "\n" +
        "本卦：" + hexBen[0] + "，互卦：" + hexHu[0] + "，变卦：" + hexBian[0] + "，第" + dong + "爻动。\n" +
        "体卦：" + tiGua.name + "(" + tiGua.wx + ")，本用卦：" + yongGua.name + "(" + yongGua.wx + ") [" + benVerdict + "]，变用卦：" + bianYongGua.name + "(" + bianYongGua.wx + ") [" + bianVerdict + "]。";
      logMsg("梅花排盘完成: " + hexBen[0] + " -> " + hexBian[0]);
    }

    // ========== 3. 铁板神数（接入 lunar-javascript 权威节气八字 + 纳音 + 十神 + 命宫 + 大运） ==========
    function castTieban() {
      if (typeof Solar === "undefined") {
        return alert("历法库 lunar-javascript 尚未加载完成，请稍候 1 秒重试。");
      }
      const dateStr = document.getElementById("tbDate").value || "1990-06-15";
      const timeStr = document.getElementById("tbTime").value || "09:30";
      const genderCode = parseInt(document.getElementById("tbGender").value, 10);
      const genderLabel = genderCode === 1 ? "乾造（男）" : "坤造（女）";
      const ke = parseInt(document.getElementById("tbKe").value, 10);
      const note = document.getElementById("tbNote").value.trim();

      const [Y, M, D] = dateStr.split("-").map(Number);
      const [H, Min] = timeStr.split(":").map(Number);

      const solar = Solar.fromYmdHms(Y, M, D, H, Min, 0);
      const lunar = solar.getLunar();
      const ec = lunar.getEightChar();

      const yGZ = ec.getYear(), mGZ = ec.getMonth(), dGZ = ec.getDay(), hGZ = ec.getTime();
      const yun = ec.getYun(genderCode);
      const dayunList = yun.getDaYun().slice(1, 6).map(dy => dy.getStartAge() + "岁:" + dy.getGanZhi()).join(" → ");

      // 结合权威四柱地支序数 + 考刻计算皇极基数
      const z1 = ZHI_LIST.indexOf(ec.getYearZhi()) + 1;
      const z2 = ZHI_LIST.indexOf(ec.getMonthZhi()) + 1;
      const z3 = ZHI_LIST.indexOf(ec.getDayZhi()) + 1;
      const z4 = ZHI_LIST.indexOf(ec.getTimeZhi()) + 1;
      const baseNum = ((z1 * 1000 + z2 * 100 + z3 * 10 + z4 + ke * 131 + (genderCode ? 7 : 3)) % 11000) + 1001;
      const code1 = String(baseNum).padStart(5, "0");
      const code2 = String(((baseNum + 2468) % 12000) + 1001).padStart(5, "0");
      const code3 = String(((baseNum + 5184) % 12000) + 1001).padStart(5, "0");

      const c1 = TIEBAN_POOL[baseNum % TIEBAN_POOL.length];
      const c2 = TIEBAN_POOL[(baseNum + 5) % TIEBAN_POOL.length];
      const c3 = TIEBAN_POOL[(baseNum + 9) % TIEBAN_POOL.length];

      document.getElementById("tbBaziInfo").innerHTML =
        "<b>命造：</b>" + genderLabel + " &nbsp;|&nbsp; <b>农历：</b>" + lunar.toString() + " &nbsp;|&nbsp; <b>考刻：</b>第 " + ke + " 刻<br/>" +
        "<table class='bazi-table'>" +
        "<tr><th>四柱</th><th>年柱</th><th>月柱</th><th>日柱（日主）</th><th>时柱</th></tr>" +
        "<tr><td>干支</td><td style='color:#f5d076;font-weight:700;'>" + yGZ + "</td><td style='color:#f5d076;font-weight:700;'>" + mGZ + "</td><td style='color:#38bdf8;font-weight:700;'>" + dGZ + "</td><td style='color:#f5d076;font-weight:700;'>" + hGZ + "</td></tr>" +
        "<tr><td>五行</td><td>" + ec.getYearWuXing() + "</td><td>" + ec.getMonthWuXing() + "</td><td>" + ec.getDayWuXing() + "</td><td>" + ec.getTimeWuXing() + "</td></tr>" +
        "<tr><td>纳音</td><td>" + ec.getYearNaYin() + "</td><td>" + ec.getMonthNaYin() + "</td><td>" + ec.getDayNaYin() + "</td><td>" + ec.getTimeNaYin() + "</td></tr>" +
        "<tr><td>十神</td><td>" + ec.getYearShiShenGan() + "</td><td>" + ec.getMonthShiShenGan() + "</td><td>日主</td><td>" + ec.getTimeShiShenGan() + "</td></tr>" +
        "</table>" +
        "<b>胎元：</b>" + ec.getTaiYuan() + " &nbsp;|&nbsp; <b>命宫：</b>" + ec.getMingGong() + " &nbsp;|&nbsp; <b>身宫：</b>" + ec.getShenGong() + "<br/>" +
        "<b>大运排盘：</b>" + dayunList;

      document.getElementById("tbClauses").innerHTML =
        '<div class="tieban-clause"><span class="tag">命格总断 · 条文 ' + code1 + '</span><div style="margin-top:5px;">' + c1 + '</div></div>' +
        '<div class="tieban-clause"><span class="tag">事业财禄 · 条文 ' + code2 + '</span><div style="margin-top:5px;">' + c2 + '</div></div>' +
        '<div class="tieban-clause"><span class="tag">流年转机 · 条文 ' + code3 + '</span><div style="margin-top:5px;">' + c3 + '</div></div>';

      document.getElementById("tbResult").style.display = "block";
      document.getElementById("tbAiOut").style.display = "none";

      lastContext.tieban =
        "命造：" + genderLabel + "，公历 " + dateStr + " " + timeStr + "，农历 " + lunar.toString() + "（第" + ke + "刻）\n" +
        "权威节气四柱：" + yGZ + " " + mGZ + " " + dGZ + " " + hGZ + "\n" +
        "纳音：" + ec.getYearNaYin() + " / " + ec.getMonthNaYin() + " / " + ec.getDayNaYin() + " / " + ec.getTimeNaYin() + "\n" +
        "胎元：" + ec.getTaiYuan() + "，命宫：" + ec.getMingGong() + "，大运：" + dayunList + "\n" +
        "考刻补充：" + (note || "无") + "\n" +
        "条文：" + code1 + " " + c1 + " | " + code2 + " " + c2;
      logMsg("铁板与权威八字排盘完成: " + yGZ + " " + mGZ + " " + dGZ + " " + hGZ);
    }

    // ========== 4. Gemini AI 多模型防 429 轮询解盘 ==========
    const GEMINI_MODELS = [
      "gemini-3.5-flash-lite",
      "gemini-3.5-flash",
      "gemini-3.6-flash",
      "gemini-3.7-flash",
      "gemini-3.8-flash"
    ];

    async function callGeminiText(apiKey, promptText) {
      let lastErr = "Gemini 请求失败";
      for (const model of GEMINI_MODELS) {
        const url = "https://generativelanguage.googleapis.com/v1beta/models/" + model + ":generateContent?key=" + encodeURIComponent(apiKey);
        const res = await fetch(url, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ contents: [{ parts: [{ text: promptText }] }] })
        });
        if (res.ok) {
          const data = await res.json();
          return data.candidates?.[0]?.content?.parts?.[0]?.text || "（AI 返回为空）";
        }
        lastErr = "HTTP " + res.status + " (" + model + ")";
        if (res.status === 429 || res.status === 404 || res.status === 503) {
          logMsg(model + " 返回 " + res.status + "，自动切换下一个模型...");
          continue;
        }
        throw new Error(lastErr);
      }
      throw new Error(lastErr);
    }

    async function runAiInterpret(kind) {
      const apiKey = (localStorage.getItem(STORAGE_KEY_API) || document.getElementById("aiApiKey").value || "").trim();
      if (!(apiKey.startsWith("AIza") || apiKey.startsWith("AQ."))) {
        alert("请先点击顶部「⚙️ 设置/激活」填入你的 Gemini API Key（支持 AQ. 或 AIza 开头）！");
        return;
      }
      const outMap = { yijing: "yjAiOut", meihua: "mhAiOut", tieban: "tbAiOut" };
      const outEl = document.getElementById(outMap[kind]);
      outEl.style.display = "block";
      outEl.textContent = "⏳ 正在结合传统典籍与权威排盘为您推演断语...";

      const roleMap = {
        yijing: "你是一位精通《周易》六十四卦、象传与六爻断法的易学大师。请按【一、卦象总断】【二、事态演变】【三、趋吉避凶建议】三段输出精炼、直白、有洞察力的解卦报告。",
        meihua: "你是一位精通邵康节《梅花易数》的大师。请紧扣本卦、互卦、变卦以及体用五行生克，按【一、体用吉凶】【二、过程玄机（互卦）】【三、结局与应期提示】输出清晰断语。",
        tieban: "你是一位精通《铁板神数》与子平八字的命理大师。请结合四柱、五行纳音、十神、命宫大运与考刻条文，按【一、命格气象】【二、事业财运与六亲提示】【三、大运流年行动建议】输出专业客观的解盘。"
      };

      try {
        const reply = await callGeminiText(apiKey, roleMap[kind] + "\n\n排盘数据：\n" + lastContext[kind]);
        outEl.textContent = reply;
        logMsg("AI 解盘成功 (" + kind + ")");
      } catch (e) {
        outEl.textContent = "❌ AI 解盘失败：" + e.message;
        logMsg("AI 解盘失败: " + e.message);
      }
    }

    function saveApiKey() {
      const k = document.getElementById("aiApiKey").value.trim();
      localStorage.setItem(STORAGE_KEY_API, k);
      logMsg(k ? "API Key 已保存" : "API Key 已清空");
      alert(k ? "✅ Gemini API Key 已保存！" : "已清空 Key。");
    }

    function activateLicense() {
      const k = document.getElementById("licInput").value.trim();
      if (!k.startsWith("YI1.") || k.length < 16) return alert("激活码格式无效，需为 YI1.xxx 格式。");
      localStorage.setItem(STORAGE_KEY_LIC, k);
      refreshLicenseUI();
      alert("🎉 永久专业版已激活！");
    }

    function refreshLicenseUI() {
      const lic = localStorage.getItem(STORAGE_KEY_LIC);
      document.getElementById("licenseBadge").innerText = (lic && lic.startsWith("YI1.")) ? "专业买断版 · 已解锁" : "基础免费版";
    }

    function renderAlmanac() {
      const bar = document.getElementById("almanacBar");
      if (typeof Solar === "undefined") {
        bar.innerHTML = "⚠️ 离线历法库加载中...";
        setTimeout(renderAlmanac, 600);
        return;
      }
      const l = Solar.fromDate(new Date()).getLunar();
      const yi = l.getDayYi().slice(0, 5).join("、");
      const ji = l.getDayJi().slice(0, 4).join("、");
      bar.innerHTML =
        "📅 <b>今日黄历：</b>" + l.getYearInGanZhiExact() + "年 " + l.getMonthInChinese() + "月" + l.getDayInChinese() +
        "（" + l.getMonthInGanZhiExact() + "月 " + l.getDayInGanZhiExact() + "日 " + l.getTimeInGanZhi() + "时）" +
        "<br/>✅ <b>宜：</b>" + yi + " &nbsp;|&nbsp; ⛔ <b>忌：</b>" + ji + " &nbsp;|&nbsp; 🧭 <b>财神方位：</b>" + l.getDayPositionCaiDesc();
      logMsg("lunar-javascript 权威历法引擎就绪 ✅");
    }

    (function boot() {
      const savedKey = localStorage.getItem(STORAGE_KEY_API);
      if (savedKey) document.getElementById("aiApiKey").value = savedKey;
      refreshLicenseUI();
      renderAlmanac();
      logMsg("易经玄数大师 v1.0.0 启动完成 (64卦典籍 + lunar-javascript)");
    })();
  </script>
